<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aviva Partner Network — Monthly Newsletter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --midnight:    #070200;
  --cream:       #F9F7F4;
  --cream-dk:    #EDE8E2;
  --sand:        #C2BCAC;
  --stone:       #6E6762;
  --terracotta:  #A86125;
  --maroon:      #5E111B;
  --pale-green:  #A0B0A3;
  --red:         #c0392b;
  --green:       #2d7a5a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#111;color:var(--midnight);min-height:100vh;}

/* ── EDITOR ── */
#editor{background:#111;padding:24px;min-height:100vh;}
.ed-header{text-align:center;margin-bottom:28px;padding:28px 32px;background:linear-gradient(135deg,var(--midnight),#1a1410);border-radius:12px;color:var(--cream);border:1px solid rgba(194,188,172,0.15);}
.ed-header h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:300;letter-spacing:-0.01em;margin-bottom:6px;}
.ed-header p{opacity:.55;font-size:12px;font-weight:300;letter-spacing:0.08em;text-transform:uppercase;}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.ed-box{background:#1c1c1c;border-radius:10px;padding:22px;border:1px solid #2a2a2a;}
.ed-box h3{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;color:var(--sand);margin-bottom:16px;}
.ed-label{font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:0.14em;color:#888;margin-bottom:5px;display:block;}
.ed-input{width:100%;background:#252525;border:1px solid #333;border-radius:6px;padding:9px 12px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--cream);outline:none;transition:border-color .2s;}
.ed-input:focus{border-color:var(--terracotta);}
textarea.ed-input{resize:vertical;min-height:90px;}
.ed-month-row{display:flex;align-items:center;gap:8px;}
.btn-nav{background:#2a2a2a;border:1px solid #383838;color:var(--sand);width:32px;height:36px;border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-nav:hover{background:#333;border-color:var(--terracotta);}
select.ed-input{cursor:pointer;}
.ed-section-box{background:#1c1c1c;border-radius:10px;padding:22px;border:1px solid #2a2a2a;margin-bottom:18px;}
.ed-section-box h3{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;color:var(--sand);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.card-item{background:#252525;border:1px solid #333;border-radius:8px;padding:14px;}
.card-item-top{display:flex;gap:10px;margin-bottom:8px;}
.card-item-top input{flex:1;background:#1c1c1c;border:1px solid #333;border-radius:5px;padding:7px 10px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--cream);outline:none;}
.card-item-top input:focus{border-color:var(--terracotta);}
.card-item textarea{width:100%;background:#1c1c1c;border:1px solid #333;border-radius:5px;padding:7px 10px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--cream);outline:none;resize:vertical;min-height:60px;}
.card-item textarea:focus{border-color:var(--terracotta);}
.card-item-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.card-item-footer input{flex:1;background:#1c1c1c;border:1px solid #333;border-radius:5px;padding:6px 10px;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;color:#aaa;outline:none;margin-right:8px;}
.card-item-footer input::placeholder{color:#555;}
.btn-remove{background:none;border:none;color:#555;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:4px;}
.btn-remove:hover{color:var(--red);background:#2a1515;}
.btn-add{background:#252525;border:1px dashed #383838;border-radius:6px;padding:9px;width:100%;color:#666;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;letter-spacing:0.06em;}
.btn-add:hover{background:#2a2a2a;border-color:var(--terracotta);color:var(--sand);}
.ed-actions{display:flex;gap:12px;justify-content:center;padding-top:8px;}
.btn-preview{background:var(--terracotta);border:none;color:var(--cream);padding:13px 32px;border-radius:8px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;cursor:pointer;letter-spacing:0.04em;}
.btn-preview:hover{background:#b96b2a;}
.btn-pdf{background:var(--midnight);border:1px solid var(--sand);color:var(--sand);padding:13px 28px;border-radius:8px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;cursor:pointer;letter-spacing:0.04em;}
.btn-pdf:hover{border-color:var(--cream);color:var(--cream);}
.kpi-status{font-size:11px;padding:3px 8px;border-radius:12px;font-weight:500;}
.kpi-ok{background:#1a3326;color:#4caf7d;}
.kpi-warn{background:#2e2010;color:#d4844a;}
.kpi-off{background:#2a1212;color:#e06060;}

/* ── PREVIEW ── */
#preview{display:none;background:#e8e4de;min-height:100vh;padding:32px 24px;}
#preview-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center;}
.btn-back{background:#333;border:none;color:#ccc;padding:10px 20px;border-radius:7px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;}
.btn-back:hover{background:#444;}

/* ── NEWSLETTER OUTPUT ── */
#newsletter{max-width:780px;margin:0 auto;background:var(--cream);border-radius:4px;overflow:hidden;box-shadow:0 8px 48px rgba(7,2,0,0.22);}

/* Masthead */
.nl-masthead{position:relative;height:220px;overflow:hidden;background:var(--midnight);}
.nl-masthead-hero{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:0.82;}
.nl-masthead-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to right,rgba(7,2,0,0.80) 0%,rgba(7,2,0,0.20) 55%,rgba(7,2,0,0.02) 100%);}
.nl-masthead-content{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 52px;}
.nl-masthead-logo{height:40px;width:auto;object-fit:contain;object-position:left center;margin-bottom:16px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6));}
.nl-masthead-labels{display:flex;align-items:center;gap:14px;}
.nl-masthead-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:400;text-transform:uppercase;letter-spacing:0.28em;color:rgba(249,247,244,0.55);}
.nl-masthead-sep{width:1px;height:10px;background:rgba(249,247,244,0.25);display:inline-block;}
.nl-masthead-meta{position:absolute;bottom:0;right:52px;display:flex;align-items:center;gap:12px;padding-bottom:20px;}
.nl-masthead-period{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;color:rgba(249,247,244,0.48);letter-spacing:0.07em;}
.nl-masthead-dot{color:rgba(249,247,244,0.25);}

/* Accent line below masthead */
.nl-accent-bar{height:3px;background:linear-gradient(90deg,var(--terracotta) 0%,var(--sand) 50%,rgba(194,188,172,0.08) 100%);}

/* Intro */
.nl-intro{background:var(--cream);padding:36px 52px 30px;}
.nl-intro-inner{display:flex;align-items:flex-start;gap:22px;}
.nl-avatar{width:52px;height:52px;border-radius:50%;background:var(--midnight);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--sand);flex-shrink:0;letter-spacing:0.02em;}
.nl-intro-body h4{font-size:10px;font-weight:400;text-transform:uppercase;letter-spacing:0.22em;color:var(--stone);margin-bottom:10px;}
.nl-intro-body p{font-size:13.5px;font-weight:300;line-height:1.65;color:var(--midnight);}
.nl-sig{margin-top:14px;}
.nl-sig strong{font-size:13px;font-weight:600;color:var(--midnight);display:block;}
.nl-sig span{font-size:11.5px;font-weight:300;color:var(--stone);}

/* KPI section */
.nl-kpi-section{background:var(--midnight);padding:32px 52px;}
.nl-kpi-eyebrow{font-size:9px;font-weight:400;text-transform:uppercase;letter-spacing:0.28em;color:rgba(249,247,244,0.45);margin-bottom:16px;}
.nl-kpi-heading{font-size:26px;font-weight:200;letter-spacing:-0.01em;color:var(--cream);margin-bottom:24px;line-height:1.1;}
.nl-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.nl-kpi-card{background:rgba(249,247,244,0.05);border-radius:8px;padding:16px;position:relative;border:1px solid rgba(194,188,172,0.12);}
.nl-kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:8px 8px 0 0;}
.nl-kpi-card.good::before{background:var(--pale-green);}
.nl-kpi-card.warn::before{background:var(--terracotta);}
.nl-kpi-card.bad::before{background:var(--maroon);}
.nl-kpi-card.neutral::before{background:var(--stone);}
.nl-kpi-name{font-size:9px;text-transform:uppercase;letter-spacing:0.2em;color:rgba(249,247,244,0.45);font-weight:400;margin-bottom:8px;}
.nl-kpi-val{font-size:24px;font-weight:200;color:var(--cream);line-height:1.1;letter-spacing:-0.01em;}
.nl-kpi-target{font-size:10px;color:rgba(249,247,244,0.38);margin-top:4px;font-weight:300;}
.nl-kpi-badge{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;font-weight:500;padding:3px 9px;border-radius:10px;letter-spacing:0.02em;}
.nl-kpi-badge.on{background:rgba(160,176,163,0.18);color:var(--pale-green);}
.nl-kpi-badge.near{background:rgba(168,97,37,0.18);color:var(--terracotta);}
.nl-kpi-badge.off{background:rgba(94,17,27,0.22);color:#e06060;}
.nl-partner-table-wrap{overflow-x:auto;}
.nl-table{width:100%;border-collapse:collapse;font-size:12px;}
.nl-table th{background:rgba(249,247,244,0.06);color:rgba(249,247,244,0.5);font-size:9px;text-transform:uppercase;letter-spacing:0.18em;padding:9px 12px;text-align:left;font-weight:400;}
.nl-table td{padding:10px 12px;border-bottom:1px solid rgba(249,247,244,0.06);color:rgba(249,247,244,0.82);font-weight:300;font-size:12px;}
.nl-table tr:last-child td{border-bottom:none;}
.nl-table tr:hover td{background:rgba(249,247,244,0.03);}
.badge-good{background:rgba(160,176,163,0.18);color:var(--pale-green);font-size:10px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.badge-warn{background:rgba(168,97,37,0.18);color:var(--terracotta);font-size:10px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.badge-off{background:rgba(94,17,27,0.22);color:#e06060;font-size:10px;padding:2px 8px;border-radius:8px;white-space:nowrap;}

/* Content sections */
.nl-section{padding:32px 52px;border-bottom:1px solid rgba(194,188,172,0.28);}
.nl-section:last-of-type{border-bottom:none;}
.nl-section-eyebrow{font-size:9px;font-weight:400;text-transform:uppercase;letter-spacing:0.28em;color:var(--stone);margin-bottom:8px;}
.nl-section-title{font-size:22px;font-weight:200;letter-spacing:-0.01em;color:var(--midnight);margin-bottom:20px;line-height:1.1;}
.nl-cards{display:flex;flex-direction:column;gap:14px;}
.nl-card{background:var(--cream-dk);border-radius:8px;padding:18px 20px;border-left:3px solid var(--terracotta);}
.nl-card-title{font-size:13px;font-weight:600;color:var(--midnight);margin-bottom:5px;}
.nl-card-body{font-size:12.5px;font-weight:300;color:var(--stone);line-height:1.6;}
.nl-card-link{display:inline-block;margin-top:8px;font-size:11px;font-weight:500;color:var(--terracotta);text-decoration:none;letter-spacing:0.03em;}
.nl-card-link:hover{text-decoration:underline;}

/* Alerts */
.nl-alerts{padding:16px 52px;background:#1e1410;}
.nl-alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(249,247,244,0.06);}
.nl-alert-item:last-child{border-bottom:none;}
.nl-alert-dot{width:6px;height:6px;border-radius:50%;background:var(--terracotta);margin-top:5px;flex-shrink:0;}
.nl-alert-text{font-size:12px;color:rgba(249,247,244,0.70);font-weight:300;line-height:1.5;}
.nl-alert-text strong{color:rgba(249,247,244,0.88);font-weight:600;}

/* Footer */
.nl-footer{background:var(--midnight);padding:28px 52px;display:flex;justify-content:space-between;align-items:center;}
.nl-footer-brand{font-size:12px;font-weight:300;color:rgba(249,247,244,0.45);letter-spacing:0.12em;text-transform:uppercase;}
.nl-footer-brand span{color:var(--sand);}
.nl-footer-info{font-size:10.5px;color:rgba(249,247,244,0.32);text-align:right;line-height:1.7;font-weight:300;}

/* ── LOADING ── */
#loading{text-align:center;padding:40px;color:#666;font-size:13px;font-weight:300;}

@media print {
  body{background:white;}
  #preview{background:white;padding:0;}
  #preview-bar{display:none !important;}
  #newsletter{box-shadow:none;border-radius:0;max-width:100%;}
}
</style>
</head>
<body>

<!-- ── EDITOR ── -->
<div id="editor">
  <div class="ed-header">
    <h1>Aviva Partner Network — Monthly Newsletter</h1>
    <p>Data loads automatically from the scorecard &nbsp;·&nbsp; Review, tweak, then preview or download</p>
  </div>

  <div class="ed-grid">
    <!-- Left: Header fields -->
    <div class="ed-box">
      <h3>Newsletter Header</h3>
      <label class="ed-label">Reporting Month</label>
      <div class="ed-month-row" style="margin-bottom:14px;">
        <button class="btn-nav" onclick="stepMonth(-1)">&#8249;</button>
        <select id="sel-month" class="ed-input" onchange="saveState()"></select>
        <button class="btn-nav" onclick="stepMonth(1)">&#8250;</button>
        <button class="btn-nav" title="Refresh data" onclick="loadSheetData()">&#8635;</button>
      </div>
      <label class="ed-label">Issue Number</label>
      <input id="inp-issue" class="ed-input" style="margin-bottom:14px;" value="Issue 01" oninput="saveState()" />
      <label class="ed-label">Author Name</label>
      <input id="inp-author" class="ed-input" style="margin-bottom:14px;" value="Nathalie Futrell" oninput="saveState()" />
      <label class="ed-label">Author Title</label>
      <input id="inp-title" class="ed-input" style="margin-bottom:14px;" value="VP of Operations" oninput="saveState()" />
      <label class="ed-label">Author Initials</label>
      <input id="inp-initials" class="ed-input" value="NF" oninput="saveState()" />
    </div>

    <!-- Right: Intro message -->
    <div class="ed-box">
      <h3>Intro Message</h3>
      <label class="ed-label">Opening Note</label>
      <textarea id="inp-intro" class="ed-input" oninput="saveState()">Hey partners,

Another strong month across the network. I&#x27;m proud to share our performance data and a few key updates. Let&#x27;s keep building on this momentum together.</textarea>
    </div>
  </div>

  <!-- Sections -->
  <div id="section-editors"></div>

  <div class="ed-actions">
    <button class="btn-preview" onclick="showPreview()">Preview Newsletter</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
  </div>
</div>

<!-- ── PREVIEW ── -->
<div id="preview">
  <div id="preview-bar">
    <button class="btn-back" onclick="backToEditor()">&#8592; Back to Editor</button>
    <button class="btn-preview" onclick="showPreview()">Refresh</button>
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
  </div>
  <div id="newsletter"></div>
</div>

<div id="loading" style="display:none;">Loading scorecard data&#8230;</div>

const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1n8_K2JxcMvRNpgdUdVSIlXeamj8J9n7CXUSjD0YHFG4/gviz/tq?tqx=out:json&sheet=Monthly%20Submissions';

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  { key:'community',   label:'&#129309; Community',      icon:'&#129309;' },

// ── STATE ──
let sheetData = [];
let state = {};

// ── MONTH SELECTOR ──
function buildMonthSelector() {
  const sel = document.getElementById('sel-month');
  const now = new Date();
  let html = '';
  for (let y = now.getFullYear(); y >= now.getFullYear() - 1; y--) {
    for (let m = 11; m >= 0; m--) {
      if (y === now.getFullYear() && m > now.getMonth()) continue;
      html += `<option value="${y}-${String(m+1).padStart(2,'0')}">${MONTHS[m]} ${y}</option>`;
    }
  }
  sel.innerHTML = html;
  const saved = localStorage.getItem('nl_month');
  if (saved) sel.value = saved;
}

function stepMonth(dir) {
  const sel = document.getElementById('sel-month');
  const idx = sel.selectedIndex - dir;
  if (idx >= 0 && idx < sel.options.length) {
    sel.selectedIndex = idx;
    saveState();
    loadSheetData();
  }
}

// ── SHEET DATA ──
function parseGvizDate(v) {
  if (!v) return null;
  const m = String(v).match(/Date\((\d+),(\d+),(\d+)/);
  if (m) return new Date(+m[1], +m[2], +m[3]);
  return null;
}

function loadSheetData() {
  document.getElementById('loading').style.display = 'block';
  const script = document.createElement('script');
  window._gvizCallback = function(resp) {
    document.getElementById('loading').style.display = 'none';
    try {
      const table = resp.table;
      const cols = table.cols.map(c => c.label.trim());
      sheetData = table.rows.map(r => {
        const row = {};
        cols.forEach((c, i) => {
          const cell = r.c[i];
          if (!cell || cell.v === null) { row[c] = null; return; }
          const d = parseGvizDate(cell.v);
          row[c] = d || cell.v;
        });
        return row;
      });
    } catch(e) { loadFallback(); }
    script.remove();
  };
  script.src = SHEET_URL + '&callback=_gvizCallback';
  script.onerror = loadFallback;
  document.head.appendChild(script);
}

function loadFallback() {
  document.getElementById('loading').style.display = 'none';
  sheetData = [];
}

// ── SECTION EDITORS ──
function makeSectionEditors() {
  const wrap = document.getElementById('section-editors');
  wrap.innerHTML = SECTIONS.map(s => `
    <div class="ed-section-box">
      <h3>${s.label}</h3>
      <div class="card-list" id="cards-${s.key}"></div>
      <button class="btn-add" onclick="addCard('${s.key}')">+ Add Card</button>
    </div>
  `).join('');
}

function addCard(section, data) {
  const list = document.getElementById('cards-' + section);
  const id = Date.now();
  const title = (data && data.title) || '';
  const body  = (data && data.body)  || '';
  const link  = (data && data.link)  || '';
  const div = document.createElement('div');
  div.className = 'card-item';
  div.dataset.id = id;
  div.innerHTML = `
    <div class="card-item-top">
      <input type="text" placeholder="Title" value="${title.replace(/"/g,'&quot;')}" oninput="saveState()" />
    </div>
    <textarea placeholder="Body copy..." oninput="saveState()">${body}</textarea>
    <div class="card-item-footer">
      <input type="text" placeholder="Optional link URL..." value="${link.replace(/"/g,'&quot;')}" oninput="saveState()" />
      <button class="btn-remove" onclick="this.closest('.card-item').remove();saveState();">&#215;</button>
    </div>
  `;
  list.appendChild(div);
  saveState();
}

function addCardLink(section) { addCard(section, null); }

function getSectionData(section) {
  const cards = [];
  document.querySelectorAll('#cards-' + section + ' .card-item').forEach(item => {
    const inputs = item.querySelectorAll('input');
    const ta = item.querySelector('textarea');
    cards.push({
      title: inputs[0] ? inputs[0].value : '',
      body:  ta ? ta.value : '',
      link:  inputs[1] ? inputs[1].value : '',
    });
  });
  return cards;
}

// ── BUILD SECTION HTML ──
function buildSectionHTML(key, label, cards) {
  if (!cards || !cards.length) return '';
  const cardsHtml = cards.map(c => `
    <div class="nl-card">
      ${c.title ? `<div class="nl-card-title">${c.title}</div>` : ''}
      ${c.body  ? `<div class="nl-card-body">${c.body.replace(/\n/g,'<br>')}</div>` : ''}
      ${c.link  ? `<a class="nl-card-link" href="${c.link}" target="_blank">Learn more &rarr;</a>` : ''}
    </div>
  `).join('');
  const eyebrow = label.replace(/<[^>]+>/g,'').trim().replace(/^[^a-zA-Z]+/,'').trim().toUpperCase();
  const cleanLabel = label.replace(/<[^>]+>/g,'').trim().replace(/^[^a-zA-Z]+/,'').trim();
  return `
    <div class="nl-section">
      <div class="nl-section-eyebrow">${eyebrow}</div>
      <div class="nl-section-title">${cleanLabel}</div>
      <div class="nl-cards">${cardsHtml}</div>
    </div>
  `;
}

// ── BUILD NEWSLETTER ──
function buildNewsletter() {
  const sel     = document.getElementById('sel-month');
  const period  = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
  const issue   = document.getElementById('inp-issue').value;
  const author  = document.getElementById('inp-author').value;
  const jobTitle= document.getElementById('inp-title').value;
  const initials= document.getElementById('inp-initials').value;
  const intro   = document.getElementById('inp-intro').value;

  // KPI data from sheet
  const [yr, mo] = (sel.value || '').split('-').map(Number);
  const periodRows = sheetData.filter(r => {
    if (!r['Submission Date'] && !r['Month'] && !r['Reporting Month']) return false;
    const d = r['Submission Date'] || r['Month'] || r['Reporting Month'];
    if (d instanceof Date) return d.getFullYear()===yr && d.getMonth()+1===mo;
    return String(d).includes(period);
  });

  const avg = (key) => {
    const vals = periodRows.map(r => parseFloat(r[key])).filter(v => !isNaN(v));
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
  };
  const sum = (key) => {
    const vals = periodRows.map(r => parseFloat(r[key])).filter(v => !isNaN(v));
    return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
  };
  const fmt = (v, prefix='', suffix='', decimals=0) =>
    v !== null ? prefix + v.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g,',') + suffix : '—';
  const badge = (val, target, dir='up') => {
    if (val === null) return '<span class="nl-kpi-badge neutral">No data</span>';
    const ok = dir==='up' ? val>=target : val<=target;
    const near = dir==='up' ? val>=target*0.85 : val<=target*1.15;
    if (ok)   return '<span class="nl-kpi-badge on">&#10003; On target</span>';
    if (near) return '<span class="nl-kpi-badge near">&#9650; Near target</span>';
    return '<span class="nl-kpi-badge off">&#9660; Below target</span>';
  };
  const cardStatus = (val, target, dir='up') => {
    if (val === null) return 'neutral';
    const ok = dir==='up' ? val>=target : val<=target;
    const near = dir==='up' ? val>=target*0.85 : val<=target*1.15;
    return ok ? 'good' : near ? 'warn' : 'bad';
  };

  const netRev    = sum('Net Revenue') || sum('Total Revenue');
  const rebookRate= avg('Rebooking Rate');
  const utilRate  = avg('Provider Utilization') || avg('Util. Rate');
  const newPts    = avg('New Patients/Mo') || avg('New Patients Per Month');
  const membRev   = avg('Membership Fee Rev %') || avg('Membership Revenue %');
  const consultTx = avg('Consult to Tx Rate') || avg('Consult→Tx');
  const cogsP     = avg('COGs %') || avg('COGS %');
  const payrollP  = avg('Payroll %');
  const numPartners= periodRows.length;
  const kpiGaps   = periodRows.filter(r => {
    const util = parseFloat(r['Provider Utilization']||r['Util. Rate']);
    const rebook = parseFloat(r['Rebooking Rate']);
    return (util < 80) || (rebook < 60);
  }).length;

  // Partner table
  const partnerRows = periodRows.map(r => {
    const name = r['Partner'] || r['Partner Name'] || r['Location'] || '—';
    const rev = r['Net Revenue'] || r['Total Revenue'];
    const rb = parseFloat(r['Rebooking Rate']);
    const util = parseFloat(r['Provider Utilization']||r['Util. Rate']);
    const rbBadge = isNaN(rb) ? '<span class="badge-warn">—</span>' :
      rb>=60 ? `<span class="badge-good">${rb.toFixed(0)}%</span>` :
      rb>=50 ? `<span class="badge-warn">${rb.toFixed(0)}%</span>` :
               `<span class="badge-off">${rb.toFixed(0)}%</span>`;
    const utBadge = isNaN(util) ? '<span class="badge-warn">—</span>' :
      util>=80 ? `<span class="badge-good">${util.toFixed(0)}%</span>` :
      util>=68 ? `<span class="badge-warn">${util.toFixed(0)}%</span>` :
                 `<span class="badge-off">${util.toFixed(0)}%</span>`;
    const revFmt = rev !== null && !isNaN(parseFloat(rev)) ?
      '$' + parseFloat(rev).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',') : '—';
    return `<tr><td>${name}</td><td>${revFmt}</td><td>${rbBadge}</td><td>${utBadge}</td></tr>`;
  }).join('');

  const hasKpiData = periodRows.length > 0;

  const kpiBlock = hasKpiData ? `
    <div class="nl-kpi-section">
      <div class="nl-kpi-eyebrow">Network Performance</div>
      <div class="nl-kpi-heading">Key metrics for ${period}</div>
      <div class="nl-kpi-grid">
        <div class="nl-kpi-card ${cardStatus(netRev,0,'up')}">
          <div class="nl-kpi-name">Network Revenue</div>
          <div class="nl-kpi-val">${fmt(netRev,'$')}</div>
          <div class="nl-kpi-target">${numPartners} partner${numPartners!==1?'s':''} reporting</div>
        </div>
        <div class="nl-kpi-card ${cardStatus(rebookRate,60)}">
          <div class="nl-kpi-name">Avg Rebooking Rate</div>
          <div class="nl-kpi-val">${fmt(rebookRate,'','%',1)}</div>
          <div class="nl-kpi-target">Target ≥60%</div>
          ${badge(rebookRate,60)}
        </div>
        <div class="nl-kpi-card ${cardStatus(utilRate,80)}">
          <div class="nl-kpi-name">Avg Provider Util.</div>
          <div class="nl-kpi-val">${fmt(utilRate,'','%',1)}</div>
          <div class="nl-kpi-target">Target ≥80%</div>
          ${badge(utilRate,80)}
        </div>
        <div class="nl-kpi-card ${cardStatus(newPts,30)}">
          <div class="nl-kpi-name">Avg New Patients/Mo</div>
          <div class="nl-kpi-val">${fmt(newPts,'','',1)}</div>
          <div class="nl-kpi-target">Target ≥30/mo</div>
          ${badge(newPts,30)}
        </div>
        <div class="nl-kpi-card ${cardStatus(consultTx,70)}">
          <div class="nl-kpi-name">Consult → Tx Rate</div>
          <div class="nl-kpi-val">${fmt(consultTx,'','%',1)}</div>
          <div class="nl-kpi-target">Target ≥70%</div>
          ${badge(consultTx,70)}
        </div>
        <div class="nl-kpi-card ${kpiGaps>0?'warn':'good'}">
          <div class="nl-kpi-name">Partners w/ KPI Gaps</div>
          <div class="nl-kpi-val">${kpiGaps}</div>
          <div class="nl-kpi-target">Need attention</div>
        </div>
      </div>
      ${partnerRows ? `
      <table class="nl-table">
        <thead><tr><th>Partner</th><th>Net Revenue</th><th>Rebooking</th><th>Provider Util.</th></tr></thead>
        <tbody>${partnerRows}</tbody>
      </table>` : ''}
    </div>
  ` : `
    <div class="nl-kpi-section" style="text-align:center;padding:32px 52px;">
      <div class="nl-kpi-eyebrow">Network Performance</div>
      <div class="nl-kpi-heading" style="font-size:18px;opacity:0.5;">No data for ${period}</div>
      <p style="color:rgba(249,247,244,0.35);font-size:12px;font-weight:300;margin-top:8px;">Submit scorecard data to see KPIs here.</p>
    </div>
  `;

  // Sections
  const sectionsHtml = SECTIONS.map(s =>
    buildSectionHTML(s.key, s.label, getSectionData(s.key))
  ).join('');

  document.getElementById('newsletter').innerHTML = `
    <div class="nl-masthead">
      <img class="nl-masthead-hero" src="${HERO_URL}" alt="" />
      <div class="nl-masthead-overlay"></div>
      <div class="nl-masthead-content">
        <img class="nl-masthead-logo" src="${LOGO_URL}" alt="Aviva Aesthetics" />
        <div class="nl-masthead-labels">
          <span class="nl-masthead-label">Partner Network</span>
          <span class="nl-masthead-sep"></span>
          <span class="nl-masthead-label">Monthly Newsletter</span>
        </div>
      </div>
      <div class="nl-masthead-meta">
        <span class="nl-masthead-period">${period}</span>
        <span class="nl-masthead-dot">·</span>
        <span class="nl-masthead-period">${issue}</span>
      </div>
    </div>
    <div class="nl-accent-bar"></div>
    <div class="nl-intro">
      <div class="nl-intro-inner">
        <div class="nl-avatar">${initials}</div>
        <div class="nl-intro-body">
          <h4>A note from operations</h4>
          <p>${intro.replace(/\n/g,'<br>')}</p>
          <div class="nl-sig">
            <strong>${author}</strong>
            <span>${jobTitle}</span>
          </div>
        </div>
      </div>
    </div>
    ${kpiBlock}
    ${sectionsHtml}
    <div class="nl-footer">
      <div class="nl-footer-brand">Aviva <span>Aesthetics</span></div>
      <div class="nl-footer-info">${period} &nbsp;·&nbsp; ${issue}<br>Aviva Partner Network</div>
    </div>
  `;
}

// ── NAVIGATION ──
function showPreview() {
  buildNewsletter();
  document.getElementById('editor').style.display = 'none';
  document.getElementById('preview').style.display = 'block';
  window.scrollTo(0,0);
}

function backToEditor() {
  document.getElementById('editor').style.display = 'block';
  document.getElementById('preview').style.display = 'none';
}

// ── PDF ──
function downloadPDF() {
  buildNewsletter();
  const el = document.getElementById('newsletter');
  const period = document.getElementById('sel-month').options[document.getElementById('sel-month').selectedIndex]?.text || 'newsletter';
  const issue  = document.getElementById('inp-issue').value || '';
  const filename = `Aviva-Partner-Newsletter-${period.replace(/\s+/g,'-')}.pdf`;
  const opt = {
    margin: 0,
    filename,
    image: { type:'jpeg', quality:0.95 },
    html2canvas: { scale:2, useCORS:true, logging:false },
    jsPDF: { unit:'in', format:'letter', orientation:'portrait' }
  };
  html2pdf().set(opt).from(el).save();
}

// ── STATE PERSISTENCE ──
function saveState() {
  const s = {
    month:    document.getElementById('sel-month').value,
    issue:    document.getElementById('inp-issue').value,
    author:   document.getElementById('inp-author').value,
    title:    document.getElementById('inp-title').value,
    initials: document.getElementById('inp-initials').value,
    intro:    document.getElementById('inp-intro').value,
    sections: {}
  };
  SECTIONS.forEach(sec => { s.sections[sec.key] = getSectionData(sec.key); });
  try { localStorage.setItem('nl_state', JSON.stringify(s)); } catch(e) {}
}

function restoreState() {
  try {
    const raw = localStorage.getItem('nl_state');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.month)    document.getElementById('sel-month').value  = s.month;
    if (s.issue)    document.getElementById('inp-issue').value   = s.issue;
    if (s.author)   document.getElementById('inp-author').value  = s.author;
    if (s.title)    document.getElementById('inp-title').value   = s.title;
    if (s.initials) document.getElementById('inp-initials').value= s.initials;
    if (s.intro)    document.getElementById('inp-intro').value   = s.intro;
    if (s.sections) {
      SECTIONS.forEach(sec => {
        (s.sections[sec.key] || []).forEach(card => addCard(sec.key, card));
      });
    }
  } catch(e) {}
}

// ── INIT ──
buildMonthSelector();
makeSectionEditors();
restoreState();
loadSheetData();
</script>
